<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>상하이 트립 플래너 🍊</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;800&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f1e6; --paper2:#fffaf0; --ink:#23252b; --ink2:#6b675e;
  --line:#e2d9c8; --orange:#e8630f; --orange-soft:#fdeadb;
  --shadow:0 2px 10px rgba(60,45,20,.09);
  --d1:#e05d2c; --d2:#0f7b6c; --d3:#3b6fc9; --d4:#b13a86; --d5:#c98a12; --d6:#5b57c7; --d7:#2a8f4e; --d8:#8a5a3b;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  font-family:'IBM Plex Sans KR',sans-serif; color:var(--ink);
  background:var(--paper);
  background-image:radial-gradient(rgba(160,130,80,.07) 1px, transparent 1px);
  background-size:22px 22px;
  display:flex; flex-direction:column; overflow:hidden;
}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:13px; color:var(--ink)}

/* ---------- header ---------- */
header{
  flex:0 0 auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:10px 18px; background:var(--paper2); border-bottom:2px solid var(--ink);
}
header h1{font-family:'Hahmlet',serif; font-weight:800; font-size:21px; letter-spacing:-.5px; white-space:nowrap}
header h1 em{color:var(--orange); font-style:normal}
.hgroup{display:flex; align-items:center; gap:6px; background:#fff; border:1.5px solid var(--line);
  border-radius:10px; padding:5px 10px}
.hgroup label{font-size:11px; font-weight:700; color:var(--ink2); white-space:nowrap}
.hgroup input,.hgroup select{border:none; outline:none; background:transparent; font-weight:600}
.hgroup input[type=date]{width:118px}
.hgroup input[type=time]{width:96px}
.stepper{display:flex; align-items:center; gap:2px}
.stepper button{width:22px; height:22px; border:1.5px solid var(--ink); border-radius:6px; background:#fff; font-weight:800; line-height:1}
.stepper b{min-width:44px; text-align:center; font-size:14px}
.hbtns{margin-left:auto; display:flex; gap:8px}
.hbtns button{border:1.5px solid var(--ink); background:#fff; border-radius:10px; padding:6px 12px; font-size:12px; font-weight:700; box-shadow:2px 2px 0 var(--ink); transition:.12s}
.hbtns button:hover{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink)}
.hbtns button.primary{background:var(--orange); color:#fff}
#hotelSelect{max-width:190px}

/* ---------- layout ---------- */
main{flex:1 1 auto; display:grid; grid-template-columns:295px minmax(370px,1fr) minmax(340px,1.1fr); min-height:0}
@media(max-width:1100px) and (min-width:901px){ main{grid-template-columns:240px 1fr 1fr} }

/* ---------- sidebar (library) ---------- */
#library{border-right:2px solid var(--ink); background:var(--paper2); display:flex; flex-direction:column; min-height:0}
#library .libhead{padding:12px 14px 8px}
#library h2{font-family:'Hahmlet',serif; font-size:15px; font-weight:800}
#library .sub{font-size:11px; color:var(--ink2); margin-top:2px}
#libSearch{width:100%; margin-top:8px; border:1.5px solid var(--line); border-radius:8px; padding:6px 10px; background:#fff; outline:none}
#libSearch:focus{border-color:var(--orange)}
.cattabs{display:flex; flex-wrap:wrap; gap:4px; padding:8px 14px 8px}
.cattabs button{font-size:11px; font-weight:700; padding:4px 9px; border-radius:99px; border:1.5px solid var(--line); background:#fff; color:var(--ink2)}
.cattabs button.on{background:var(--ink); color:#fff; border-color:var(--ink)}
#libList{flex:1; overflow-y:auto; padding:4px 14px 20px; min-height:0}
.libitem{
  background:#fff; border:1.5px solid var(--line); border-radius:10px;
  padding:8px 10px; margin-bottom:7px; cursor:grab; position:relative; transition:border-color .12s;
}
.libitem:hover{border-color:var(--orange)}
.libitem .nm{font-weight:700; font-size:13px; line-height:1.3}
.libitem .zh{font-size:11px; color:var(--ink2)}
.libitem .cat{position:absolute; top:8px; right:9px; font-size:10px; font-weight:700; color:var(--orange)}
.libitem .addbtn{position:absolute; bottom:7px; right:8px; width:22px; height:22px; border-radius:7px; border:1.5px solid var(--ink);
  background:var(--orange-soft); font-weight:800; font-size:14px; line-height:1; display:none}
.libitem:hover .addbtn{display:block}
.libnote{font-size:11px; color:var(--ink2); padding:2px 2px 8px}
#customBox{border-top:2px dashed var(--line); padding:10px 14px 14px; background:#fdf8ee}
#customBox h3{font-size:12px; font-weight:800; margin-bottom:6px}
#customBox .row{display:flex; gap:6px; margin-bottom:6px}
#customBox input{flex:1; border:1.5px solid var(--line); border-radius:8px; padding:6px 9px; background:#fff; outline:none}
#customBox button{border:1.5px solid var(--ink); border-radius:8px; background:#fff; font-size:11px; font-weight:700; padding:5px 9px}
#customBox button.on{background:var(--orange); color:#fff}
#searchResults{max-height:130px; overflow-y:auto}
#searchResults .sr{font-size:11.5px; padding:5px 8px; background:#fff; border:1px solid var(--line); border-radius:7px; margin-bottom:4px; cursor:pointer}
#searchResults .sr:hover{border-color:var(--orange)}

/* ---------- board ---------- */
#board{display:flex; flex-direction:column; min-height:0; min-width:0}
#dayTabs{display:flex; gap:0; overflow-x:auto; flex:0 0 auto; border-bottom:2px solid var(--ink); background:var(--paper);}
#dayTabs button{
  flex:0 0 auto; border:none; background:transparent; padding:10px 16px 8px; font-size:12.5px; font-weight:700;
  color:var(--ink2); border-right:1.5px dashed var(--line); position:relative;
}
#dayTabs button .dt{display:block; font-size:10px; font-weight:500}
#dayTabs button.on{color:#fff; background:var(--tabclr,var(--ink));}
#dayList{flex:1; overflow-y:auto; padding:16px 20px 60px; min-height:0}
.anchor{
  display:flex; align-items:center; gap:10px; background:var(--ink); color:#fff;
  border-radius:12px; padding:10px 14px; font-size:13px; font-weight:600;
}
.anchor .ic{font-size:17px}
.anchor small{opacity:.75; font-weight:400; display:block; font-size:11px}
.anchor.hotel{background:#fff; color:var(--ink); border:1.5px dashed var(--ink)}
.dayitems{min-height:30px; padding:2px 0}
.seg{
  display:flex; align-items:center; gap:8px; padding:3px 0 3px 17px; font-size:11.5px; color:var(--ink2);
}
.seg .dotline{width:2px; height:26px; background:repeating-linear-gradient(var(--ink2) 0 3px, transparent 3px 7px); opacity:.5}
.seg b{color:var(--ink); font-weight:700}
.card{
  background:#fff; border:1.5px solid var(--ink); border-radius:13px; box-shadow:var(--shadow);
  padding:9px 12px 9px 10px; display:flex; gap:9px; align-items:flex-start; position:relative;
}
.card.ghosting{opacity:.4}
.card .badge{
  flex:0 0 auto; width:26px; height:26px; border-radius:50%; background:var(--dayclr,var(--orange));
  color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; margin-top:2px;
  cursor:grab; font-family:'Hahmlet',serif;
}
.card .bodyc{flex:1; min-width:0}
.card .l1{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.card .l1 input.tm{border:none; outline:none; background:var(--orange-soft); border-radius:6px; padding:1px 5px; font-weight:700; font-size:12px; width:104px}
.card .l1 .nm{font-weight:700; font-size:14px}
.card .l1 .zh{font-size:11px; color:var(--ink2)}
.card .quick{font-size:11.5px; color:var(--ink2); margin-top:2px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.card.open .quick{display:block; -webkit-line-clamp:unset}
.card .links{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap}
.card .links a,.card .links button{
  font-size:10.5px; font-weight:700; text-decoration:none; color:var(--ink);
  border:1px solid var(--line); border-radius:6px; padding:2px 7px; background:var(--paper2);
}
.card .links a:hover{border-color:var(--orange); color:var(--orange)}
.card .memo{width:100%; margin-top:6px; border:1.5px dashed var(--line); border-radius:8px; padding:5px 8px; font-size:12px; background:#fffdf5; resize:vertical; min-height:34px; display:none; outline:none}
.card.open .memo{display:block}
.card .del{position:absolute; top:7px; right:8px; border:none; background:none; color:#c33; font-size:13px; font-weight:800; opacity:.35}
.card .del:hover{opacity:1}
.card .toggle{position:absolute; bottom:7px; right:8px; border:none; background:none; font-size:11px; color:var(--ink2)}
.dayfoot{margin-top:14px; font-size:12px; color:var(--ink2); text-align:center}
.dayfoot b{color:var(--ink)}
.empty-hint{border:2px dashed var(--line); border-radius:12px; padding:22px; text-align:center; color:var(--ink2); font-size:12.5px; margin:8px 0}

/* ---------- map ---------- */
#mapPane{border-left:2px solid var(--ink); position:relative; min-height:0}
#map{position:absolute; inset:0}
#mapCtl{position:absolute; z-index:800; top:10px; right:10px; display:flex; gap:6px}
#mapCtl button{border:1.5px solid var(--ink); background:#fff; border-radius:8px; font-size:11px; font-weight:700; padding:5px 9px; box-shadow:2px 2px 0 rgba(0,0,0,.25)}
#mapCtl button.on{background:var(--ink); color:#fff}
#mapMsg{position:absolute; z-index:800; bottom:12px; left:50%; transform:translateX(-50%); background:rgba(35,37,43,.88); color:#fff; font-size:11.5px; padding:5px 12px; border-radius:99px; display:none; white-space:nowrap}
.numpin{
  width:26px; height:26px; border-radius:50% 50% 50% 4px; transform:rotate(-45deg);
  border:2px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.4);
  display:flex; align-items:center; justify-content:center;
}
.numpin span{transform:rotate(45deg); color:#fff; font-weight:800; font-size:12px; font-family:'Hahmlet',serif}
.iconpin{font-size:22px; text-shadow:0 1px 3px rgba(0,0,0,.4)}
.leaflet-popup-content{font-family:'IBM Plex Sans KR',sans-serif; font-size:12.5px}
.leaflet-popup-content b{font-size:13.5px}

/* drag ghost */
.sortable-ghost{opacity:.35}
.sortable-drag{opacity:.95}

/* ---------- mobile ---------- */
#settingsToggle{display:none; margin-left:auto; border:1.5px solid var(--ink); background:#fff; border-radius:8px; padding:5px 11px; font-weight:700; font-size:12px; box-shadow:2px 2px 0 var(--ink)}
#mobileNav{display:none; flex:0 0 auto; border-top:2px solid var(--ink); background:var(--paper2); padding-bottom:env(safe-area-inset-bottom)}
#mobileNav button{flex:1; padding:8px 0 6px; border:none; background:transparent; font-size:11px; font-weight:700; color:var(--ink2)}
#mobileNav button span{display:block; font-size:19px; line-height:1.2}
#mobileNav button.on{color:var(--orange)}
@media(pointer:coarse){ .libitem .addbtn{display:block} }
@media(max-width:900px){
  header{gap:8px; padding:8px 12px}
  header h1{font-size:18px}
  header .hgroup, header .hbtns{display:none}
  header.open .hgroup{display:flex}
  header.open .hbtns{display:flex; margin-left:0; width:100%; justify-content:flex-end}
  #settingsToggle{display:block}
  #mobileNav{display:flex}
  main{display:flex; min-height:0}
  #library,#board,#mapPane{display:none; width:100%; min-width:0; border:none}
  body.v-lib #library{display:flex}
  body.v-plan #board{display:flex}
  body.v-map #mapPane{display:block; flex:1}
  #dayList{padding:14px 12px 40px}
  #dayTabs button{padding:9px 13px 7px}
  .card .l1 input.tm{width:96px; font-size:11.5px}
  dialog{width:92vw}
}

dialog{border:2px solid var(--ink); border-radius:14px; padding:20px; max-width:420px; box-shadow:6px 6px 0 rgba(35,37,43,.25); background:var(--paper2)}
dialog::backdrop{background:rgba(35,37,43,.45)}
dialog h3{font-family:'Hahmlet',serif; margin-bottom:10px}
dialog textarea{width:100%; height:180px; border:1.5px solid var(--line); border-radius:8px; padding:8px; font-size:11px; background:#fff}
dialog .btns{display:flex; gap:8px; margin-top:12px; justify-content:flex-end}
dialog button{border:1.5px solid var(--ink); background:#fff; border-radius:8px; padding:6px 14px; font-weight:700; font-size:12px}
dialog button.primary{background:var(--orange); color:#fff}
</style>
</head>
<body class="v-plan">

<header>
  <h1>상하이 트립 플래너 <em>🍊</em></h1>
  <button id="settingsToggle">⚙️ 설정</button>
  <div class="hgroup"><label>출발일</label><input type="date" id="startDate"></div>
  <div class="hgroup"><label>기간</label>
    <div class="stepper"><button id="nMinus">−</button><b id="nightsLabel">5박 6일</b><button id="nPlus">＋</button></div>
  </div>
  <div class="hgroup"><label>✈️ 도착</label><input type="time" id="arrTime"></div>
  <div class="hgroup"><label>✈️ 출발</label><input type="time" id="depTime"></div>
  <div class="hgroup"><label>🏨 숙소</label><select id="hotelSelect"></select></div>
  <div class="hgroup"><label>경로에 숙소 포함</label><input type="checkbox" id="hotelInRoute"></div>
  <div class="hbtns">
    <button id="btnExport">내보내기</button>
    <button id="btnImport">가져오기</button>
    <button id="btnReset">초기화</button>
  </div>
</header>

<main>
  <!-- library -->
  <aside id="library">
    <div class="libhead">
      <h2>장소 라이브러리</h2>
      <div class="sub">by 윤제주(@yooonjeju) 가이드 · 드래그하거나 ＋로 일정에 추가</div>
      <input id="libSearch" placeholder="장소 검색…">
    </div>
    <div class="cattabs" id="catTabs"></div>
    <div id="libList"></div>
    <div id="customBox">
      <h3>➕ 새 장소 추가</h3>
      <div class="row"><input id="cpName" placeholder="장소 이름 (예: OO카페)"></div>
      <div class="row">
        <button id="cpSearch">🔍 지도에서 검색</button>
        <button id="cpPick">📍 지도 클릭으로 지정</button>
      </div>
      <div id="searchResults"></div>
    </div>
  </aside>

  <!-- board -->
  <section id="board">
    <div id="dayTabs"></div>
    <div id="dayList"></div>
  </section>

  <!-- map -->
  <section id="mapPane">
    <div id="map"></div>
    <div id="mapCtl">
      <button id="mapModeDay" class="on">이 날만</button>
      <button id="mapModeAll">전체 보기</button>
    </div>
    <div id="mapMsg"></div>
  </section>
</main>

<nav id="mobileNav">
  <button data-view="plan" class="on"><span>📋</span>일정</button>
  <button data-view="map"><span>🗺️</span>지도</button>
  <button data-view="lib"><span>➕</span>장소</button>
</nav>

<dialog id="ioDialog">
  <h3 id="ioTitle">일정 내보내기</h3>
  <textarea id="ioText"></textarea>
  <div class="btns">
    <button id="ioCopy">복사</button>
    <button id="ioApply" class="primary">적용</button>
    <button onclick="ioDialog.close()">닫기</button>
  </div>
</dialog>

<script>
/* ============================================================
   DATA — 윤제주 상하이 가이드 기반 장소 데이터
   좌표는 근사값입니다. 지도에서 핀을 드래그하면 위치를 보정할 수 있어요.
============================================================ */
const HOTELS = [

 {id:'h_bw',   name:'브로드웨이 맨션 호텔', zh:'上海大厦', lat:31.2465, lng:121.4905, tip:'10만원 초반~ / 100년 역사 클래식 5성급. 리버뷰(와이탄) 강추. 5% 할인코드: YOOONJEJU'},
 {id:'h_gc',   name:'그랜드 센트럴 상하이', zh:'上海南新雅大酒店', lat:31.2355, lng:121.4790, tip:'난징동루 중심 위치 1등! 한국인이 가장 많이 가는 곳'},
 {id:'h_eton', name:'디 이튼 상하이', zh:'裕景大饭店', lat:31.2210, lng:121.5290, tip:'가격 대비 넓은 룸, 가성비, 지하철 앞이라 교통 편리'},
];

// cat: tour 관광 / food 맛집 / cafe 카페·디저트 / shop 쇼핑 / etc 기타
// def:[day(1-base), order, 'HH:MM'] → 기본 5박6일 일정 배치
const PLACES = [
 // ---- Day 1
 {id:'checkin', name:'숙소 체크인', zh:'', cat:'etc', useHotel:true, def:[1,1,'14:00'], tip:'짐 풀고 가볍게 출발!'},
 {id:'crabnoodle', name:'장씨네 게살국수', zh:'庄氏隆兴 (뉴월드 다이마루점)', cat:'food', lat:31.2390, lng:121.4855, amap:'https://surl.amap.com/jyqFJcyq7qZ', def:[1,2,'15:00'], tip:'가성비 게살국수 맛집. 샤오롱바오는 고기/새우 섞인 게 더 맛있어요. 따종디엔핑 쿠폰 검색! 2인 3.5~4만원'},

 {id:'bund', name:'와이탄', zh:'外滩', cat:'tour', lat:31.2380, lng:121.4890, amap:'https://surl.amap.com/jFdqSWOk3uE', def:[1,5,'18:00'], tip:'점등 순간이 가장 예뻐요! 동계 18:00 / 하계 19:00 점등. 시계탑(강해관) 앞 횡단보도가 메인 포토존'},

const AIRPORT = {name:'푸동공항', zh:'浦东国际机场', lat:31.1443, lng:121.8083};
const DAY_COLORS = ['#e05d2c','#0f7b6c','#3b6fc9','#b13a86','#c98a12','#5b57c7','#2a8f4e','#8a5a3b','#c74b5e','#3c8f9e'];
const CATS = [['all','전체'],['tour','🏛️ 관광'],['food','🥢 맛집'],['cafe','🧁 카페'],['shop','🛍️ 쇼핑'],['etc','📌 기타'],['custom','⭐ 내 장소']];
const CATLABEL = {tour:'관광',food:'맛집',cafe:'카페',shop:'쇼핑',etc:'기타',custom:'내 장소'};

/* ============================================================ state ============================================================ */
const LS_KEY = 'shanghai-trip-v1';
let state = null;
let uidSeq = 1;
const uid = () => 'i' + (uidSeq++) + '_' + Math.random().toString(36).slice(2,6);

function defaultState(){
  const days = [];
  for(let d=1; d<=6; d++){
    const items = PLACES.filter(p=>p.def && p.def[0]===d)
      .sort((a,b)=>a.def[1]-b.def[1])
      .map(p=>({uid:uid(), pid:p.id, time:p.def[2], memo:''}));
    days.push(items);
  }
  return {
    settings:{ startDate: nextMonth(), nights:5, arrTime:'12:00', depTime:'18:00', hotel:'h_ji', hotelInRoute:true },
    days, activeDay:0, custom:[], coordFix:{}, mapMode:'day'
  };
}
function nextMonth(){ const d=new Date(); d.setDate(d.getDate()+30); return d.toISOString().slice(0,10); }

function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
function load(){
  try{ const s = JSON.parse(localStorage.getItem(LS_KEY)); if(s && s.days) return s; }catch(e){}
  return null;
}

/* place lookup (built-in + custom), 좌표 보정 반영 */
function getPlace(pid){
  let p = PLACES.find(x=>x.id===pid) || state.custom.find(x=>x.id===pid);
  if(!p) return null;
  const out = Object.assign({}, p);
  if(p.useHotel){ const h = getHotel(); out.lat=h.lat; out.lng=h.lng; out.zh = h.name; }
  const fix = state.coordFix[pid];
  if(fix){ out.lat=fix[0]; out.lng=fix[1]; }
  return out;
}
function getHotel(){
  const h = HOTELS.find(x=>x.id===state.settings.hotel) || state.custom.find(x=>x.id===state.settings.hotel) || HOTELS[0];
  const fix = state.coordFix[h.id];
  return fix ? Object.assign({},h,{lat:fix[0],lng:fix[1]}) : h;
}
const numDays = () => state.settings.nights + 1;

/* ============================================================ header controls ============================================================ */
const $ = s => document.querySelector(s);

function initHeader(){
  const st = state.settings;
  $('#startDate').value = st.startDate;
  $('#arrTime').value = st.arrTime;
  $('#depTime').value = st.depTime;
  $('#hotelInRoute').checked = st.hotelInRoute;
  const sel = $('#hotelSelect');
  sel.innerHTML='';
  HOTELS.concat(state.custom.filter(c=>c.isHotel)).forEach(h=>{
    const o=document.createElement('option'); o.value=h.id; o.textContent=h.name; sel.appendChild(o);
  });
  const oc=document.createElement('option'); oc.value='__custom'; oc.textContent='＋ 직접 지정 (지도 클릭)'; sel.appendChild(oc);
  sel.value = st.hotel;
  $('#nightsLabel').textContent = `${st.nights}박 ${st.nights+1}일`;

  $('#startDate').onchange = e=>{ st.startDate=e.target.value; refresh(); };
  $('#arrTime').onchange = e=>{ st.arrTime=e.target.value; refresh(); };
  $('#depTime').onchange = e=>{ st.depTime=e.target.value; refresh(); };
  $('#hotelInRoute').onchange = e=>{ st.hotelInRoute=e.target.checked; refresh(); };
  sel.onchange = e=>{
    if(e.target.value==='__custom'){ startHotelPick(); sel.value=st.hotel; return; }
    st.hotel=e.target.value; refresh();
  };
  $('#nMinus').onclick = ()=> changeNights(-1);
  $('#nPlus').onclick = ()=> changeNights(1);
  $('#btnExport').onclick = ()=> openIO('export');
  $('#btnImport').onclick = ()=> openIO('import');
  $('#btnReset').onclick = ()=>{
    if(confirm('일정을 기본(윤제주 5박 6일 코스)으로 초기화할까요? 내 장소·메모도 사라집니다.')){
      localStorage.removeItem(LS_KEY); state = defaultState(); initAll();
    }
  };
}
function changeNights(delta){
  const st=state.settings;
  const n = Math.min(9, Math.max(1, st.nights+delta));
  if(n===st.nights) return;
  if(n < st.nights){
    // 줄어드는 날의 일정은 마지막 남는 날 뒤로 합치지 않고 경고 후 삭제 대신 마지막 날로 이동
    const removed = state.days.slice(n+1).flat();
    state.days = state.days.slice(0, n+1);
    if(removed.length){ state.days[state.days.length-1].push(...removed); }
  }else{
    while(state.days.length < n+1) state.days.push([]);
  }
  st.nights = n;
  if(state.activeDay >= numDays()) state.activeDay = numDays()-1;
  $('#nightsLabel').textContent = `${n}박 ${n+1}일`;
  refresh();
}

/* ============================================================ library ============================================================ */
let libCat = 'all';
function renderCatTabs(){
  const box = $('#catTabs'); box.innerHTML='';
  CATS.forEach(([k,label])=>{
    const b=document.createElement('button'); b.textContent=label;
    if(k===libCat) b.classList.add('on');
    b.onclick=()=>{ libCat=k; renderCatTabs(); renderLibrary(); };
    box.appendChild(b);
  });
}
function renderLibrary(){
  const q = $('#libSearch').value.trim().toLowerCase();
  const box = $('#libList'); box.innerHTML='';
  const inTrip = new Set(state.days.flat().map(i=>i.pid));
  let list = PLACES.concat(state.custom.filter(c=>!c.isHotel));
  if(libCat==='custom') list = state.custom.filter(c=>!c.isHotel);
  else if(libCat!=='all') list = list.filter(p=>p.cat===libCat);
  if(q) list = list.filter(p=> (p.name+(p.zh||'')+(p.tip||'')).toLowerCase().includes(q));
  const note=document.createElement('div'); note.className='libnote';
  note.textContent = `${list.length}곳 · ✓는 일정에 이미 있는 곳`;
  box.appendChild(note);
  list.forEach(p=>{
    const el=document.createElement('div'); el.className='libitem'; el.dataset.pid=p.id;
    el.innerHTML = `<div class="nm">${inTrip.has(p.id)?'✓ ':''}${esc(p.name)}</div>
      <div class="zh">${esc(p.zh||'')}</div>
      <div class="cat">${CATLABEL[p.cat]||''}</div>
      <button class="addbtn" title="현재 날짜에 추가">＋</button>`;
    el.querySelector('.addbtn').onclick = (e)=>{ e.stopPropagation(); addToDay(p.id, state.activeDay); };
    box.appendChild(el);
  });
  if(libSortable) libSortable.destroy();
  libSortable = Sortable.create(box, {
    group:{name:'trip', pull:'clone', put:false},
    sort:false, draggable:'.libitem',
    delay:150, delayOnTouchOnly:true,
    setData:(dt)=>dt.setData('text',''),
  });
}
let libSortable = null;
$('#libSearch') && ($('#libSearch').oninput = ()=>renderLibrary());

function addToDay(pid, dayIdx, index){
  const item = {uid:uid(), pid, time:'', memo:''};
  if(index==null) state.days[dayIdx].push(item);
  else state.days[dayIdx].splice(index,0,item);
  refresh();
  if(isMobile()) setView('plan'); // 모바일: 추가 후 일정 화면으로
}

/* ---------- mobile views ---------- */
const isMobile = () => window.matchMedia('(max-width:900px)').matches;
function setView(v){
  document.body.classList.remove('v-plan','v-map','v-lib');
  document.body.classList.add('v-'+v);
  document.querySelectorAll('#mobileNav button').forEach(b=>b.classList.toggle('on', b.dataset.view===v));
  if(v==='map' && map) setTimeout(()=>{ map.invalidateSize(); renderMap(); }, 80);
}
document.querySelectorAll('#mobileNav button').forEach(b=> b.onclick=()=>setView(b.dataset.view));
$('#settingsToggle').onclick = ()=> document.querySelector('header').classList.toggle('open');

/* ============================================================ board ============================================================ */
const DOW = ['일','월','화','수','목','금','토'];
function dayDate(i){
  const d = new Date(state.settings.startDate+'T00:00:00');
  d.setDate(d.getDate()+i);
  return d;
}
function renderTabs(){
  const box=$('#dayTabs'); box.innerHTML='';
  for(let i=0;i<numDays();i++){
    const b=document.createElement('button');
    const d=dayDate(i);
    b.innerHTML = `Day ${i+1}<span class="dt">${d.getMonth()+1}/${d.getDate()} (${DOW[d.getDay()]})</span>`;
    b.style.setProperty('--tabclr', DAY_COLORS[i%DAY_COLORS.length]);
    if(i===state.activeDay) b.classList.add('on');
    b.onclick=()=>{ state.activeDay=i; refresh(); };
    box.appendChild(b);
  }
}

let daySortable=null;
function renderDay(){
  const i = state.activeDay;
  const color = DAY_COLORS[i%DAY_COLORS.length];
  const box=$('#dayList'); box.innerHTML='';
  const st=state.settings;
  const hotel=getHotel();

  // 상단 앵커
  if(i===0){
    box.appendChild(anchorEl('✈️', `${st.arrTime} 푸동공항 도착`, '디디택시 B2층 탑승 or 트립닷컴 픽업(가족여행 강추)'));
  }else if(st.hotelInRoute){
    box.appendChild(anchorEl('🏨', `${esc(hotel.name)} 출발`, hotel.zh||'', true));
  }

  // 카드 목록
  const ul=document.createElement('div'); ul.className='dayitems'; ul.id='dayItems';
  const items = state.days[i];
  if(!items.length){
    const eh=document.createElement('div'); eh.className='empty-hint';
    eh.textContent='왼쪽 라이브러리에서 장소를 드래그하거나 ＋ 버튼으로 추가하세요';
    ul.appendChild(eh);
  }
  items.forEach((it,idx)=>{
    if(idx>0 || i===0 || st.hotelInRoute) ul.appendChild(segEl(idx));
    ul.appendChild(cardEl(it, idx, color));
  });
  box.appendChild(ul);

  // 하단 앵커
  const isLast = i===numDays()-1;
  if(items.length && (st.hotelInRoute || isLast)) box.appendChild(segEl(items.length));
  if(isLast){
    box.appendChild(anchorEl('✈️', `${st.depTime} 푸동공항 출발`, '2~3시간 전 공항 도착 권장 · 짐 찾으러 호텔 경유 잊지 마세요!'));
  }else if(st.hotelInRoute){
    box.appendChild(anchorEl('🏨', `${esc(hotel.name)} 복귀`, '', true));
  }

  const foot=document.createElement('div'); foot.className='dayfoot'; foot.id='dayFoot';
  foot.innerHTML = `장소 <b>${items.length}</b>곳`;
  box.appendChild(foot);

  if(daySortable) daySortable.destroy();
  daySortable = Sortable.create(ul, {
    group:'trip', animation:150, handle:'.badge', draggable:'.card',
    filter:'.seg,.empty-hint', delay:120, delayOnTouchOnly:true,
    onAdd: (ev)=>{
      // 라이브러리에서 클론된 항목
      const pid = ev.item.dataset.pid;
      if(pid){
        const idx = cardIndexOf(ev.item);
        ev.item.remove();
        addToDay(pid, state.activeDay, idx);
      }
    },
    onUpdate: ()=>{ syncFromDom(); refresh(); },
  });
}
function cardIndexOf(el){
  const cards=[...$('#dayItems').querySelectorAll('.card')];
  return cards.indexOf(el)>=0 ? cards.indexOf(el) : cards.length;
}
function syncFromDom(){
  const uids=[...$('#dayItems').querySelectorAll('.card')].map(c=>c.dataset.uid).filter(Boolean);
  const cur=state.days[state.activeDay];
  const map=Object.fromEntries(cur.map(x=>[x.uid,x]));
  state.days[state.activeDay]=uids.map(u=>map[u]).filter(Boolean);
}

function anchorEl(ic, title, sub, isHotel){
  const el=document.createElement('div'); el.className='anchor'+(isHotel?' hotel':'');
  el.innerHTML=`<span class="ic">${ic}</span><div><div>${title}</div>${sub?`<small>${esc(sub)}</small>`:''}</div>`;
  return el;
}
function segEl(idx){
  const el=document.createElement('div'); el.className='seg'; el.dataset.seg=idx;
  el.innerHTML=`<div class="dotline"></div><span id="seg-${idx}">🚕 계산 중…</span>`;
  return el;
}
function cardEl(it, idx, color){
  const p=getPlace(it.pid);
  const el=document.createElement('div'); el.className='card'; el.dataset.uid=it.uid;
  el.style.setProperty('--dayclr', color);
  if(!p){ el.innerHTML='<div class="bodyc">(삭제된 장소)</div>'; return el; }
  const gmap=`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
  el.innerHTML=`
    <div class="badge">${idx+1}</div>
    <div class="bodyc">
      <div class="l1">
        <input class="tm" type="time" value="${it.time||''}" title="시간">
        <span class="nm">${esc(p.name)}</span>
        <span class="zh">${esc(p.zh||'')}</span>
      </div>
      ${p.tip?`<div class="quick">💡 ${esc(p.tip)}</div>`:''}
      <div class="links">
        <a href="${gmap}" target="_blank">구글지도 📍</a>
        ${p.amap?`<a href="${p.amap}" target="_blank">고덕지도 🇨🇳</a>`:''}
        <button class="memobtn">📝 메모</button>
      </div>
      <textarea class="memo" placeholder="우리끼리 메모 (예: 웨이팅 몇 시에 걸기, 예산…)">${esc(it.memo||'')}</textarea>
    </div>
    <button class="del" title="일정에서 빼기">✕</button>
    <button class="toggle">▾ 더보기</button>`;
  el.querySelector('.tm').onchange=e=>{ it.time=e.target.value; save(); };
  el.querySelector('.del').onclick=()=>{
    state.days[state.activeDay]=state.days[state.activeDay].filter(x=>x.uid!==it.uid); refresh();
  };
  const toggle=()=>{ el.classList.toggle('open'); el.querySelector('.toggle').textContent=el.classList.contains('open')?'▴ 접기':'▾ 더보기'; };
  el.querySelector('.toggle').onclick=toggle;
  el.querySelector('.memobtn').onclick=()=>{ if(!el.classList.contains('open')) toggle(); el.querySelector('.memo').focus(); };
  el.querySelector('.memo').oninput=e=>{ it.memo=e.target.value; save(); };
  el.querySelector('.quick') && (el.querySelector('.quick').onclick=toggle);
  return el;
}

/* ============================================================ map ============================================================ */
let map, layerG;
function initMap(){
  map = L.map('map',{zoomControl:true}).setView([31.23,121.48],13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
    maxZoom:19, attribution:'&copy; OpenStreetMap &copy; CARTO'
  }).addTo(map);
  layerG = L.layerGroup().addTo(map);
  $('#mapModeDay').onclick=()=>{ state.mapMode='day'; $('#mapModeDay').classList.add('on'); $('#mapModeAll').classList.remove('on'); renderMap(); };
  $('#mapModeAll').onclick=()=>{ state.mapMode='all'; $('#mapModeAll').classList.add('on'); $('#mapModeDay').classList.remove('on'); renderMap(); };
  map.on('click', onMapClick);
}
function numIcon(n,color){
  return L.divIcon({className:'', html:`<div class="numpin" style="background:${color}"><span>${n}</span></div>`, iconSize:[26,26], iconAnchor:[13,24]});
}
function emojiIcon(e){ return L.divIcon({className:'', html:`<div class="iconpin">${e}</div>`, iconSize:[24,24], iconAnchor:[12,20]}); }

/* 하루 경유지 좌표열 만들기: [출발앵커] + items + [도착앵커] */
function dayWaypoints(i){
  const st=state.settings, hotel=getHotel(), isLast=i===numDays()-1;
  const pts=[];
  if(i===0) pts.push({name:AIRPORT.name, lat:AIRPORT.lat, lng:AIRPORT.lng, anchor:'✈️'});
  else if(st.hotelInRoute) pts.push({name:hotel.name, lat:hotel.lat, lng:hotel.lng, anchor:'🏨'});
  state.days[i].forEach((it,k)=>{
    const p=getPlace(it.pid); if(p) pts.push({name:p.name, lat:p.lat, lng:p.lng, n:k+1, pid:it.pid});
  });
  if(isLast) pts.push({name:AIRPORT.name, lat:AIRPORT.lat, lng:AIRPORT.lng, anchor:'✈️'});
  else if(st.hotelInRoute && state.days[i].length) pts.push({name:hotel.name, lat:hotel.lat, lng:hotel.lng, anchor:'🏨'});
  return pts;
}

let routeToken=0;
function renderMap(){
  if(!map) return;
  layerG.clearLayers();
  const hotel=getHotel();
  // 호텔 핀(항상)
  L.marker([hotel.lat, hotel.lng], {icon:emojiIcon('🏨'), draggable:true})
    .bindPopup(`<b>🏨 ${esc(hotel.name)}</b><br>${esc(hotel.tip||'')}<br><i>핀을 드래그하면 위치가 보정됩니다</i>`)
    .on('dragend', e=>{ const ll=e.target.getLatLng(); state.coordFix[hotel.id]=[ll.lat,ll.lng]; refresh(); })
    .addTo(layerG);

  const daysToShow = state.mapMode==='all' ? [...Array(numDays()).keys()] : [state.activeDay];
  const bounds=[[hotel.lat,hotel.lng]];

  daysToShow.forEach(i=>{
    const color=DAY_COLORS[i%DAY_COLORS.length];
    state.days[i].forEach((it,k)=>{
      const p=getPlace(it.pid); if(!p) return;
      bounds.push([p.lat,p.lng]);
      const m=L.marker([p.lat,p.lng],{icon:numIcon(k+1,color), draggable: state.mapMode==='day'})
        .bindPopup(`<b>Day ${i+1}-${k+1} · ${esc(p.name)}</b><br>${esc(p.zh||'')}${p.tip?'<br>💡 '+esc(p.tip):''}<br><i>핀 드래그 → 위치 보정</i>`)
        .addTo(layerG);
      m.on('dragend', e=>{ const ll=e.target.getLatLng(); state.coordFix[it.pid]=[ll.lat,ll.lng]; refresh(); });
    });
  });

  // 경로: 활성 날만
  drawRoute(state.activeDay);

  if(bounds.length>1){
    try{ map.fitBounds(bounds,{padding:[40,40], maxZoom:15}); }catch(e){}
  }
}

/* ---------- routing (OSRM demo, 캐시+폴백) ---------- */
const routeCache = JSON.parse(localStorage.getItem('sh-routecache')||'{}');
function cacheKey(a,b){ return [a.lat.toFixed(4),a.lng.toFixed(4),b.lat.toFixed(4),b.lng.toFixed(4)].join(','); }
function haversine(a,b){
  const R=6371, dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function estimate(a,b){
  const d=haversine(a,b)*1.35;
  const speed = d>30?70 : d>8?40 : 22; // km/h
  return {dur: d/speed*3600, dist:d*1000, est:true, geom:[[a.lat,a.lng],[b.lat,b.lng]]};
}
async function fetchRoute(a,b){
  const key=cacheKey(a,b);
  if(routeCache[key]) return routeCache[key];
  try{
    const url=`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;
    const r=await fetch(url); if(!r.ok) throw 0;
    const j=await r.json(); if(!j.routes||!j.routes[0]) throw 0;
    const rt=j.routes[0];
    const res={dur:rt.duration*1.15, dist:rt.distance, est:false, geom:rt.geometry.coordinates.map(c=>[c[1],c[0]])};
    routeCache[key]=res;
    try{ localStorage.setItem('sh-routecache', JSON.stringify(routeCache)); }catch(e){}
    return res;
  }catch(e){ return estimate(a,b); }
}
function fmtDur(s){ const m=Math.round(s/60); return m>=60? `${Math.floor(m/60)}시간 ${m%60}분` : `${m}분`; }
function fmtDist(m){ return m>=1000? (m/1000).toFixed(1)+'km' : Math.round(m)+'m'; }

async function drawRoute(dayIdx){
  const token=++routeToken;
  const pts=dayWaypoints(dayIdx);
  const color=DAY_COLORS[dayIdx%DAY_COLORS.length];
  if(pts.length<2){ msg(''); return; }
  let totalDur=0, totalDist=0, anyEst=false;
  msg('🚕 이동 경로 계산 중…');
  for(let k=0;k<pts.length-1;k++){
    const res=await fetchRoute(pts[k],pts[k+1]);
    if(token!==routeToken) return; // 최신 요청만 반영
    totalDur+=res.dur; totalDist+=res.dist; anyEst=anyEst||res.est;
    if(dayIdx===state.activeDay){
      L.polyline(res.geom,{color, weight:4, opacity:.75, dashArray:res.est?'6 8':null}).addTo(layerG);
      const segSpan=document.getElementById(`seg-${k}`);
      if(segSpan) segSpan.innerHTML=`🚕 <b>${fmtDur(res.dur)}</b> · ${fmtDist(res.dist)}${res.est?' <i>(직선거리 추정)</i>':''}`;
    }
  }
  if(token!==routeToken) return;
  msg('');
  const foot=$('#dayFoot');
  if(foot && dayIdx===state.activeDay){
    foot.innerHTML=`장소 <b>${state.days[dayIdx].length}</b>곳 · 총 이동 <b>${fmtDur(totalDur)}</b> · <b>${fmtDist(totalDist)}</b> (택시 기준${anyEst?', 일부 추정':''})`;
  }
}
let msgTimer=null;
function msg(t){
  const el=$('#mapMsg');
  if(!t){ el.style.display='none'; return; }
  el.textContent=t; el.style.display='block';
}

/* ============================================================ custom place / hotel pick ============================================================ */
let pickMode=null; // 'place' | 'hotel'
function onMapClick(e){
  if(!pickMode) return;
  const {lat,lng}=e.latlng;
  if(pickMode==='place'){
    const nm=$('#cpName').value.trim()||'새 장소';
    const id='c_'+Date.now();
    state.custom.push({id, name:nm, zh:'', cat:'custom', lat, lng, tip:'직접 추가한 장소'});
    addToDay(id, state.activeDay);
    $('#cpName').value='';
  }else if(pickMode==='hotel'){
    const nm=prompt('숙소 이름을 입력하세요','내 숙소');
    if(nm){
      const id='ch_'+Date.now();
      state.custom.push({id, name:nm, zh:'', cat:'custom', lat, lng, isHotel:true, tip:'직접 지정한 숙소'});
      state.settings.hotel=id;
      initHeader();
    }
  }
  pickMode=null; $('#cpPick').classList.remove('on'); msg('');
  refresh();
}
$('#cpPick').onclick=()=>{
  pickMode = pickMode==='place'? null : 'place';
  $('#cpPick').classList.toggle('on', pickMode==='place');
  msg(pickMode?'지도를 클릭해 장소 위치를 지정하세요':'');
  if(pickMode && isMobile()) setView('map');
};
function startHotelPick(){ pickMode='hotel'; msg('지도를 클릭해 숙소 위치를 지정하세요'); if(isMobile()) setView('map'); }

$('#cpSearch').onclick=async ()=>{
  const q=$('#cpName').value.trim();
  if(!q){ alert('장소 이름을 먼저 입력하세요'); return; }
  const box=$('#searchResults'); box.innerHTML='<div class="libnote">검색 중…</div>';
  try{
    const url=`https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=ko&q=${encodeURIComponent(q+' Shanghai')}`;
    const r=await fetch(url,{headers:{'Accept':'application/json'}});
    const j=await r.json();
    box.innerHTML='';
    if(!j.length){ box.innerHTML='<div class="libnote">결과 없음 — "지도 클릭으로 지정"을 써보세요</div>'; return; }
    j.forEach(res=>{
      const d=document.createElement('div'); d.className='sr'; d.textContent=res.display_name;
      d.onclick=()=>{
        const id='c_'+Date.now();
        state.custom.push({id, name:q, zh:'', cat:'custom', lat:+res.lat, lng:+res.lon, tip:'검색으로 추가한 장소'});
        addToDay(id, state.activeDay);
        box.innerHTML=''; $('#cpName').value='';
      };
      box.appendChild(d);
    });
  }catch(e){ box.innerHTML='<div class="libnote">검색 실패 — 인터넷 연결을 확인하세요</div>'; }
};

/* ============================================================ export / import ============================================================ */
function openIO(mode){
  const dlg=$('#ioDialog');
  $('#ioTitle').textContent = mode==='export'?'일정 내보내기 (친구에게 이 텍스트를 보내세요)':'일정 가져오기 (받은 텍스트를 붙여넣으세요)';
  $('#ioText').value = mode==='export'? JSON.stringify(state) : '';
  $('#ioApply').style.display = mode==='import'?'':'none';
  $('#ioCopy').style.display = mode==='export'?'':'none';
  dlg.showModal();
}
$('#ioCopy').onclick=()=>{ $('#ioText').select(); document.execCommand('copy'); $('#ioCopy').textContent='복사됨!'; setTimeout(()=>$('#ioCopy').textContent='복사',1500); };
$('#ioApply').onclick=()=>{
  try{
    const s=JSON.parse($('#ioText').value);
    if(!s.days||!s.settings) throw 0;
    state=s; save(); $('#ioDialog').close(); initAll();
  }catch(e){ alert('형식이 올바르지 않습니다. 내보내기로 만든 텍스트 전체를 붙여넣어 주세요.'); }
};

/* ============================================================ boot ============================================================ */
function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function refresh(){ save(); renderTabs(); renderDay(); renderLibrary(); renderMap(); }
function initAll(){ initHeader(); renderCatTabs(); refresh(); }

state = load() || defaultState();
initMap();
initAll();
</script>
